server:
  port: 8080

app:
  storage:
    path: /home/prasad/docmindDocuments

chunk:
  max:
    size: 500
  overlap:
    size: 100

spring:
  application:
    name: DocMind-ai
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: gemini-3.6-flash
          temperature: 0.2
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            model: gemini-embedding-2
            task-type: RETRIEVAL_DOCUMENT
            dimensions: 768
  datasource:
    url: jdbc:postgresql://localhost:5432/docmind_ai
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG

